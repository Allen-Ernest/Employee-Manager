<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>All Employees | Employee Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.loading {
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans loading">

<div id="loader" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
  <div class="flex flex-col items-center gap-4">
    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-blue-600 text-sm font-semibold">Loading employee records...</p>
  </div>
</div>

<header class="bg-blue-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
  <h1 class="text-2xl font-semibold">Employee Manager</h1>
  <a th:href="@{/add}" class="bg-white text-blue-600 px-4 py-2 rounded hover:bg-blue-50 transition">+ Add New Employee</a>
</header>

<main class="p-6">
  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="px-6 py-4 border-b">
      <h2 class="text-xl font-semibold text-gray-700">All Employees</h2>
      <p class="text-sm text-gray-500 mt-1">Manage employee records below</p>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Full Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Department</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <tr th:each="employee : ${employees}">
          <td class="px-6 py-4 whitespace-nowrap" th:text="${employee.firstName} + ' ' + ${employee.lastName}">Full Name</td>
          <td class="px-6 py-4 whitespace-nowrap" th:text="${employee.department}">Department</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span th:text="${employee.active ? 'Active' : 'Inactive'}"
                  th:classappend="${employee.active} ? 'text-green-600 font-medium' : 'text-red-600 font-medium'">
              Status
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap" th:text="${employee.email}">Email</td>
          <td class="px-6 py-4 whitespace-nowrap" th:text="${employee.phone}">Phone</td>
          <td class="px-6 py-4 whitespace-nowrap flex gap-2 text-sm">
            <a th:href="@{'/employee/' + ${employee.id}}" class="text-blue-600 hover:underline">View</a>
            <a th:href="@{'/employee/edit/' + ${employee.id}}" class="text-yellow-500 hover:underline">Edit</a>
            <a th:href="@{'/employee/delete/' + ${employee.id}}"
               onclick="return confirm('Are you sure you want to delete this employee?');"
               class="text-red-600 hover:underline">Delete</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}">
          <td colspan="6" class="px-6 py-4 text-center text-gray-500">No Employees Available</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer class="text-center text-sm text-gray-400 py-4">
  &copy; 2025 Employee Manager. All rights reserved.
</footer>

<script>
  window.addEventListener('load', () => {
    document.getElementById('loader').style.display = 'none';
    document.body.classList.remove('loading');
  });
</script>

</body>
</html>
